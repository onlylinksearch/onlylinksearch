<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OnlyLinkSearch</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20vh;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 8px;
      letter-spacing: -2px;
    }

    .tagline {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .search-box {
      width: min(620px, 90%);
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      height: 52px;
      border: 1px solid #bbb;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #333;
    }

    button {
      height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      width: min(620px, 90%);
      margin-top: 25px;
      color: #666;
      line-height: 1.5;
    }

    .footer {
      margin-top: auto;
      padding: 30px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="home">

    <h1>OnlyLink</h1>

    <div class="tagline">
      Just search. Just links. No AI.
    </div>

    <form class="search-box" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search the web"
        autocomplete="off"
        required
      >

      <button type="submit">
        Search
      </button>
    </form>

    <div class="message" id="message"></div>

    <div class="footer">
      OnlyLinkSearch
    </div>

  </main>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const message = document.getElementById("message");

let currentQuery = "";
let currentPage = 0;

async function runSearch(query, page = 0, append = false) {
  if (!append) {
    message.textContent = "Searching...";
  }

  try {
    const response = await fetch(
      `/api/search?q=${encodeURIComponent(query)}&page=${page}`
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Search failed");
    }

    if (!append) {
      message.innerHTML = "";
    }

    if (!data.results || data.results.length === 0) {
      message.textContent = "No results found.";
      return;
    }

    const resultsWrap = document.createElement("div");

    data.results.forEach(result => {
      const item = document.createElement("div");
      item.style.marginBottom = "24px";

      const link = document.createElement("a");
      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title;

      const url = document.createElement("div");
      url.textContent = result.url;
      url.style.fontSize = "13px";
      url.style.opacity = "0.65";
      url.style.wordBreak = "break-all";

      const description = document.createElement("div");
      description.textContent = result.description;
      description.style.marginTop = "6px";

      item.appendChild(link);
      item.appendChild(url);
      item.appendChild(description);

      resultsWrap.appendChild(item);
    });

    message.appendChild(resultsWrap);

    const oldButton = document.getElementById("loadMore");
    if (oldButton) oldButton.remove();

    if (data.moreResultsAvailable) {
      const moreButton = document.createElement("button");
      moreButton.id = "loadMore";
      moreButton.type = "button";
      moreButton.textContent = "Show more";

      moreButton.addEventListener("click", async () => {
        currentPage++;
        moreButton.remove();
        await runSearch(currentQuery, currentPage, true);
      });

      message.appendChild(moreButton);
    }

  } catch (error) {
    message.textContent = "Search unavailable. Please try again.";
    console.error(error);
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const query = input.value.trim();
  if (!query) return;

  currentQuery = query;
  currentPage = 0;

  await runSearch(query);
});
</script>



</body>
</html>

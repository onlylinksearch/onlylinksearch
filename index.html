<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyLinkSearch</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #111111; }
    .home { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 20vh; }
    h1 { font-size: 52px; margin: 0 0 8px; letter-spacing: -2px; }
    .tagline { color: #666; margin-bottom: 30px; font-size: 16px; }
    .search-box { width: min(620px, 90%); display: flex; gap: 10px; }
    input { flex: 1; height: 52px; border: 1px solid #bbb; border-radius: 10px; padding: 0 18px; font-size: 17px; outline: none; }
    input:focus { border-color: #333; }
    button { height: 52px; padding: 0 24px; border: 0; border-radius: 10px; background: #111; color: white; font-size: 16px; cursor: pointer; }
    .message { width: min(620px, 90%); margin-top: 25px; color: #666; line-height: 1.5; }
    .footer { margin-top: auto; padding: 30px; color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <main class="home">
    <h1>OnlyLink</h1>
    <div class="tagline">Just search. Just links. No AI.</div>
    <form class="search-box" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search the web" autocomplete="off" required>
      <button type="submit">Search</button>
    </form>
    <div class="message" id="message">
      <div id="search-output" hidden>
        <p id="search-status" role="status" aria-live="polite"></p>
        <div id="search-results" aria-label="Website search results"></div>
        <button id="more-results" type="button" hidden>Show more</button>
      </div>
    </div>
    <div class="footer">OnlyLinkSearch</div>
  </main>

  <script>
    (() => {
      const form = document.getElementById('searchForm');
      const input = document.getElementById('searchInput');
      const output = document.getElementById('search-output');
      const status = document.getElementById('search-status');
      const results = document.getElementById('search-results');
      const more = document.getElementById('more-results');
      let query = '', nextPage = 0, controller, busy = false;
      const seen = new Set();
      async function search(reset) {
        if (!reset && busy) return;
        if (reset) {
          const value = input.value.trim();
          if (!value) return;
          controller?.abort();
          query = value;
          nextPage = 0;
          seen.clear();
          results.replaceChildren();
          more.hidden = true;
        }
        const request = new AbortController();
        controller = request;
        busy = true;
        more.disabled = true;
        output.hidden = false;
        status.textContent = 'Searching…';
        try {
          const response = await fetch('/api/search?' + new URLSearchParams({ q: query, page: nextPage }), { signal: request.signal });
          const data = await response.json();
          if (!response.ok || !Array.isArray(data.results)) throw new Error('Search failed');
          for (const item of data.results) {
            let url;
            try { url = new URL(item.url); } catch { continue; }
            if (!['https:', 'http:'].includes(url.protocol) || seen.has(url.href)) continue;
            seen.add(url.href);
            const row = document.createElement('div');
            const link = document.createElement('a');
            link.href = url.href;
            link.textContent = item.title || url.hostname;
            row.style.marginBottom = '24px';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            row.append(link);
            if (item.description) {
              const description = document.createElement('p');
              description.textContent = item.description;
              row.append(description);
            }
            results.append(row);
          }
          nextPage += 1;
          more.hidden = !data.moreResultsAvailable || nextPage > 9;
          status.textContent = seen.size ? seen.size + ' results for “' + query + '”.' : 'No results found.';
        } catch (error) {
          if (request.signal.aborted) return;
          status.textContent = 'Search is unavailable right now. Please try again.';
        } finally {
          if (controller === request) { busy = false; more.disabled = false; }
        }
      }
      form.addEventListener('submit', event => { event.preventDefault(); search(true); });
      more.addEventListener('click', () => search(false));
    })();
  </script>
</body>
</html>
